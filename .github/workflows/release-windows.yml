name: Build Windows portable applications

on:
  workflow_dispatch:
    inputs:
      version:
        description: Archive version label
        required: false
        default: dev
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  windows-portable:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Create virtual environment
        shell: pwsh
        run: python -m venv .venv

      - name: Resolve version label
        id: version
        shell: pwsh
        run: |
          if ("${{ github.event_name }}" -eq "push") {
            "value=${{ github.ref_name }}" >> $env:GITHUB_OUTPUT
          } else {
            "value=${{ inputs.version }}" >> $env:GITHUB_OUTPUT
          }

      - name: Build portable archives
        shell: pwsh
        run: .\scripts\build_windows_portable.ps1 -Version "${{ steps.version.outputs.value }}"

      - uses: actions/upload-artifact@v4
        with:
          name: Pluto-Spectrum-App-${{ steps.version.outputs.value }}-windows-x64
          path: release/*
          if-no-files-found: error

      - name: Publish GitHub Release
        if: github.event_name == 'push'
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: >-
          gh release create "${{ github.ref_name }}"
          release/*.zip release/SHA256SUMS.txt
          --verify-tag --generate-notes --prerelease
